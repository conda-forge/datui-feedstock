context:
  version: "0.4.3"

package:
  name: datui
  version: ${{ version }}

source:
  url: https://github.com/derekwisong/datui/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 67c302f38bc1549febc302318d42866305a4fd582e775ef9c19d99794f6dac80

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - pkg-config
  host:
    - fontconfig
    - freetype
    - expat

tests:
  - script: datui --help
  - package_contents:
      bin:
        - datui
      strict: true

about:
  homepage: https://github.com/derekwisong/datui
  summary: Data Exploration in the Terminal
  description: Datui is a high-performance terminal UI for exploring and analyzing tabular datasets.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://derekwisong.github.io/datui/
  repository: https://github.com/derekwisong/datui

extra:
  recipe-maintainers:
    - synapticarbors
